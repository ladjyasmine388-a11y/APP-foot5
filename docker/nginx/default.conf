# Site web + relais vers l'API sur UNE SEULE origine (même domaine) : pas de CORS, cookies de session « SameSite ».
#
# HTTPS : ce fichier écoute en HTTP. En production, terminez TLS devant (Caddy, Traefik, un répartiteur de charge, ou nginx avec
# certbot) et gardez le cookie de session « Secure » (l'API le fait quand NODE_ENV=production). Ajoutez alors, côté HTTPS :
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Les images envoyées font 2 Mo au plus ; on laisse une marge pour les en-têtes.
  client_max_body_size 3m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # En-têtes de sécurité. La politique de contenu n'autorise QUE ce site (scripts, styles, API) ; les images peuvent venir de
  # n'importe où en HTTPS (photos des complexes) et d'URL « data: ».
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API : l'adresse IP du client est transmise à l'API (limites de débit, journal d'audit). Cette configuration SUPPOSE que nginx
  # est la porte d'entrée : on écrase l'en-tête fourni par le client au lieu de lui faire confiance. Derrière un autre relais
  # (Caddy, Cloudflare…), remplacez $remote_addr par $proxy_add_x_forwarded_for ET configurez ce relais pour nettoyer l'en-tête.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Fichiers compilés : le nom contient l'empreinte du contenu, donc cache illimité.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie index.html (le routeur côté navigateur décide). Jamais mis en cache.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }
}
