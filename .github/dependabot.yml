# Mises à jour automatiques des dépendances : une demande groupée par semaine, jamais fusionnée sans que la CI (tests, audit,
# tests de bout en bout) ne passe au vert.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
